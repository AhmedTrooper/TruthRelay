# nginx config for TruthRelay web admin (single origin on port 80).
#
# - Serves the built Vite SPA at /.
# - Reverse-proxies /api/* to the upstream `api` container on port 8080.
# - Falls back to /index.html so vue-router can take over (SPA).
#
# In docker-compose the upstream is the sibling service named `api`. The
# `api` host name resolves through docker's embedded DNS.

upstream truthrelay_api {
    server api:8080;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Bigger payloads for sync batches.
    client_max_body_size 16m;

    # ---- API reverse proxy ----
    location /api/ {
        proxy_pass         http://truthrelay_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---- Health probe (for compose) ----
    location = /healthz {
        proxy_pass http://truthrelay_api/healthz;
    }

    # ---- Static assets ----
    # PWA precache + long-lived fingerprints.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service worker must be served from the root scope with no-cache so
    # updates are picked up on next page load.
    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    # ---- SPA fallback ----
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Tighten defaults.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY"   always;
    add_header Referrer-Policy        "no-referrer" always;
}