[package]
name = "truthrelay-api"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "truthrelay"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.0"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.4", features = ["derive", "env"] }
dirs = "6.0.0"
dotenvy = "0.15.7"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
getrandom = "0.4.3"
rand = "0.10.2"
rand_core = "0.10.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["sqlite", "macros", "chrono", "uuid", "runtime-tokio"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
